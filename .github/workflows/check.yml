name: Ubuntu compatibility
on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    env:
      DEBIAN_FRONTEND: noninteractive
      GTK_A11Y: none
      GIO_USE_VFS: local
      GSETTINGS_BACKEND: memory
      GSK_RENDERER: cairo
      GDK_BACKEND: x11
    steps:
      - name: Install development libraries
        run: |
          apt-get update
          apt-get install -y dpkg-dev desktop-file-utils build-essential pkg-config libgtk-4-dev libadwaita-1-dev gettext python3 curl ca-certificates gnupg shellcheck git xvfb xauth dbus-x11 adwaita-icon-theme libpoppler-glib-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav ffmpeg librsvg2-common xdotool
          if [ "${{ matrix.ubuntu }}" = "24.04" ]; then apt-get install -y libgtk-4-media-gstreamer; fi
      - uses: actions/checkout@v4
      - name: Installer checks (no host installation)
        run: |
          bash -n tools/install.sh
          shellcheck tools/install.sh
          python3 tools/test-install.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: rustfmt --edition 2024 --check src/ui/*_tests.rs
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Move between filesystems
        run: cargo test --locked cross_filesystem_move -- --ignored --nocapture
      - name: GTK acceptance
        # A short screen exercises scrolling in the native context menu.
        run: FINDER_GNOME_NATIVE_DND=1 xvfb-run -a -s '-screen 0 1024x768x24' dbus-run-session -- cargo test --locked gui_acceptance -- --ignored --nocapture
      - name: Isolated SMB and SFTP acceptance
        run: |
          mkdir -p /opt/rust /cargo /output
          cp -a "$(rustc --print sysroot)/." /opt/rust/
          cp -a "$HOME/.cargo/registry" /cargo/
          chmod -R a+rX /opt/rust /cargo
          FINDER_FIXTURE_WORKSPACE="$GITHUB_WORKSPACE" bash tools/fixtures/network.sh
          FINDER_FIXTURE_WORKSPACE="$GITHUB_WORKSPACE" bash tools/fixtures/trash.sh
      - name: Check translation template
        run: |
          bash tools/update-translations.sh
          msginit --no-translator --locale=en_US.UTF-8 --input=po/finder-gnome.pot --output-file=/tmp/finder-en.po
          msgfmt --check /tmp/finder-en.po -o /tmp/finder-en.mo

      - name: Build native Debian package
        run: bash tools/build-deb.sh
      - name: Install, launch and remove Debian package
        run: bash tools/fixtures/deb.sh "$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: finder-gnome-ubuntu-${{ matrix.ubuntu }}
          path: dist/*.deb
          if-no-files-found: error
